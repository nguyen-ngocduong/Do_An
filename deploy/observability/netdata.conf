# Cấu hình nhẹ cho laptop 8 GB. Giao diện chỉ mở trên localhost:19999.
[global]
    hostname = nidr-local
[db]
    mode = dbengine
    update every = 5
    storage tiers = 1
    dbengine page cache size = 16MiB
    dbengine tier 0 retention size = 128MiB
    dbengine tier 0 retention time = 1d
[web]
    bind to = 127.0.0.1:19999
[ml]
    enabled = no
[plugins]
    apps = no
    ebpf = no
    network-viewer = no
    systemd-journal = no
[registry]
    enabled = no

# Gateway container; backend/frontend chỉ được gọi qua mạng Docker.
# Gateway nhận request trình duyệt, chuyển tới service Docker tương ứng.
# Một worker Nginx đủ cho quy mô nhóm; đây không phải worker suy luận BE.
worker_processes 1;
pid /tmp/iot-sentinel-nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    # Access log JSON phục vụ quan sát: chỉ ghi các trường bên dưới, không ghi body/query/cookie.
    log_format nidr escape=json '{"time":"$time_iso8601","request_id":"$request_id","method":"$request_method","uri":"$uri","status":$status,"seconds":$request_time}';
    access_log /dev/stdout nidr;
    error_log /dev/stderr warn;
    # DNS của Docker. resolve cập nhật IP khi backend/frontend được tạo lại.
    # zone cấp vùng dùng chung cho trạng thái upstream.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream nidr_backend { zone nidr_backend 64k; server backend:8000 resolve; }
    upstream nidr_frontend { zone nidr_frontend 64k; server frontend:3000 resolve; }
    server_tokens off;
    # Gateway nhận tối đa 11 MiB để chứa multipart; BE vẫn giới hạn file 10 MiB/1.000 dòng.
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    # Không tự gửi lại request ghi sang upstream, tránh lặp thao tác/API Gemini.
    proxy_next_upstream off;
    proxy_cache off;
    # Chuyển request ID và địa chỉ người dùng truy cập tới ứng dụng.
    # Giữ Host gồm cả cổng và scheme để BE kiểm tra Origin/cookie chính xác.
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    server {
        listen 8080;
        location = /health { proxy_pass http://nidr_backend; }
        # Request HTTP được chuyển sang HTTPS; health vẫn đọc được từ healthcheck nội bộ.
        location / { return 308 https://$host$request_uri; }
    }
    server {
        # TLS kết thúc tại gateway; cert/key được Compose mount read-only từ máy chủ.
        listen 8443 ssl;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        server_name localhost;
        # Subrequest nội bộ kiểm tra phiên cookie/HTTP Basic trước khi mở trang riêng tư.
        # Không gửi body upload vào bước xác thực, không cho browser gọi location này.
        location = /_be_auth {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://nidr_backend/api/schema;
        }
        # API/Swagger/health đi thẳng BE; không vòng qua Next.js rewrites.
        # BE tự kiểm tra xác thực cho API và tài liệu; health là trạng thái công khai.
        location ^~ /api/ { proxy_pass http://nidr_backend; }
        location = /docs { proxy_pass http://nidr_backend; }
        location = /openapi.json { proxy_pass http://nidr_backend; }
        location = /health { proxy_pass http://nidr_backend; }
        # Cho phép tải trang đăng nhập và assets trước khi có phiên.
        location = /login { proxy_pass http://nidr_frontend; }
        location ^~ /_next/static/ { proxy_pass http://nidr_frontend; }
        location = /icon.svg { proxy_pass http://nidr_frontend; }
        # Helper redirect chỉ dùng qua named location bên dưới, không mở URL này ra ngoài.
        location = /login/redirect { return 404; }
        location @login_redirect {
            # Next mã hóa nguyên URI, giữ cả các query chứa & hoặc ký tự đã escape.
            proxy_set_header X-Login-Return-To $request_uri;
            proxy_set_header Host $http_host;
            rewrite ^ /login/redirect? break;
            proxy_pass http://nidr_frontend;
        }
        # Các trang nghiệp vụ HTTPS dùng cùng kiểm tra phiên như bản localhost.
        location / {
            auth_request /_be_auth;
            error_page 401 = @login_redirect;
            proxy_pass http://nidr_frontend;
            proxy_http_version 1.1;
        }
    }
}

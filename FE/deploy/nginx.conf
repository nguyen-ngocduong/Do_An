# Một máy chủ; Next.js và FastAPI chỉ bind loopback.
worker_processes 1;
pid /tmp/iot-sentinel-nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    client_max_body_size 11m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    server {
        listen 443 ssl;
        server_name localhost;
        ssl_certificate /etc/nginx/tls/server.crt;
        ssl_certificate_key /etc/nginx/tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        location = /_be_auth {
            internal;
            proxy_method GET;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Authorization $http_authorization;
            proxy_pass http://127.0.0.1:8000/api/schema;
        }
        location ^~ /api/ { proxy_pass http://127.0.0.1:8000; }
        location = /docs { proxy_pass http://127.0.0.1:8000; }
        location = /openapi.json { proxy_pass http://127.0.0.1:8000; }
        location = /health { proxy_pass http://127.0.0.1:8000; }
        location = /login { proxy_pass http://127.0.0.1:3000; }
        location ^~ /_next/static/ { proxy_pass http://127.0.0.1:3000; }
        location = /icon.svg { proxy_pass http://127.0.0.1:3000; }
        location = /login/redirect { return 404; }
        location @login_redirect {
            # Next mã hóa nguyên URI, giữ cả các query chứa & hoặc ký tự đã escape.
            proxy_set_header X-Login-Return-To $request_uri;
            proxy_set_header Host $http_host;
            rewrite ^ /login/redirect? break;
            proxy_pass http://127.0.0.1:3000;
        }
        location / {
            auth_request /_be_auth;
            error_page 401 = @login_redirect;
            proxy_pass http://127.0.0.1:3000;
            proxy_http_version 1.1;
        }
    }
}
